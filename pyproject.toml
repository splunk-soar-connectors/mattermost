# Ruff linting
[project]
name = "mattermost"
version = "3.0.1"
description = "This app integrates with Mattermost to support various investigative actions"
license = "Copyright (c) 2018-2026 Splunk Inc."
requires-python = ">=3.13,<3.14"
authors = [{ name = "Splunk" }]
dependencies = [
    "httpx>=0.27.0,<0.29",
    "splunk-soar-sdk==3.26.2",
]

[project.optional-dependencies]
soarapps-test = [
    "pytest-cov>=4.0.0,<7",
    "pytest-xdist>=3.0.0,<4",
]

[tool.soar.app]
main_module = "src.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]

### YOU SHOULD NOT NEED TO TOUCH ANYTHING BELOW THIS LINE ###

[dependency-groups]
dev = [
    "coverage>=7.6.7,<8",
    "mypy>=1.2.0,<2",
    "pre-commit>=4.2.0,<5",
    "pytest>=7.4.2,<8",
    "pytest-mock>=3.14.0,<4",
    "pytest-watch>=4.2.0,<5",
    "ruff>=0.11.6,<1",
]

[[tool.uv.index]]
url = "https://pypi.python.org/simple"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]

[tool.ruff]
output-format = "full"
fix = true
target-version = "py313"

[tool.ruff.lint]
select = [
    "ERA",  # commented out code
    "YTT",  # bad use of sys.version_info
    "S",    # security issues
    "B",    # bugbear
    "A",    # builtins
    "DTZ",  # datetime footguns
    "T10",  # breakpoints
    "ISC",  # implicit string concatenation
    "PT",   # pytest style
    "SIM",  # simplify
    "PTH",  # use pathlib
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "PL",   # pylint
    "UP",   # pyupgrade
    "RUF",  # ruff's own rules
]

ignore = [
    "E402",    # Module level import order is intentional for app entrypoints.
    "E501",    # Formatting handles line length.
    "PT006",   # Parametrize type opinions are not required here.
    "PT007",   # Parametrize type opinions are not required here.
    "PLR",     # Avoid refactor-only pylint complexity rules.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ANN",
    "S",
]

# Preserve runtime annotations used by the SOAR SDK.
[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
